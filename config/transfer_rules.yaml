# 119 이송지침 규칙 설정. 지침이 개정되면 개발팀이 이 파일을 고치고 version을 바꾼다.
# 응답의 적용 규칙 정보에 version이 들어간다.
version: "0.2"

# 적용 규칙별 레벨 조건 (design.md '119 이송지침 규칙 엔진'의 분류별 규칙 표)
# - L0은 지침의 원칙 조건, L1은 의료지도를 받아야 적용할 수 있는 완화 조건이다. L1 조건이 없는 규칙은 L1을 적지 않는다.
# - 레벨마다 허용하는 병원 분류를 적는다. 병원이 목록의 분류 중 하나 이상에 속하면 조건을 만족한다.
# - 병원 분류: 권역응급의료센터, 지역응급의료센터, 지역응급의료기관, 권역외상센터
# - 지침 문구에 "이상"이 없는 조건은 그 등급만 허용한다.
levels:
  중증외상:
    L0: [권역외상센터]  # 시·도와 관계없이 가장 가까운 권역외상센터
    L1: [지역응급의료센터]
  경증외상:
    L0: [지역응급의료기관]
  비외상 중증:
    L0: [권역응급의료센터, 지역응급의료센터]  # 지역응급의료센터 이상
    L1: [지역응급의료기관]
  비외상 경증:
    L0: [지역응급의료기관]
  심폐정지:
    L0: [권역응급의료센터, 지역응급의료센터, 지역응급의료기관]  # 지역응급의료기관 이상
  뇌졸중 의증:
    L0: [권역응급의료센터, 지역응급의료센터]  # 지역응급의료센터 이상
    L1: [지역응급의료기관]
  뇌졸중 선별검사 양성:
    # 지침 원문은 "즉시 혈전용해 치료가 가능한 지역응급의료기관 이상"이다.
    # 병원 데이터에 혈전용해 치료 가능 여부 필드가 없어서 혈전용해 조건은 적지 않았다.
    # 뇌졸중 선별검사 결과를 받을 경로가 없어서, 지금은 시스템이 이 규칙을 적용하는 환자가 없다.
    L0: [권역응급의료센터, 지역응급의료센터, 지역응급의료기관]
    L1: [지역응급의료기관]

# 중증도 판정의 활력징후 임계치
# - 항목마다 low(기록 중 가장 낮은 값이 이 값보다 작으면 중증)와 high(가장 높은 값이 이 값보다 크면 중증)를 적는다.
#   둘 다 생략할 수 있다.
# - 외상 환자: "다발성/중증손상" 지침(docs/severe-trauma-criteria.md)의 생리학적 기준
trauma_vital_signs:
  systolic_bp_mm_hg:  # 수축기혈압
    low: 90
  respiratory_rate_per_min:  # 호흡수
    low: 10
    high: 29
# - 비외상 환자: 임시값, 의료진 확인 필요
non_trauma_vital_signs:
  systolic_bp_mm_hg:  # 수축기혈압
    low: 90
  spo2_percent:  # 산소포화도
    low: 90

# 정상으로 보는 의식상태. 이 목록에 없는 consciousnessLevel 값은 중증으로 판정한다.
normal_consciousness_levels: [명료]
