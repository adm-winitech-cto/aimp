recommend_count: 10  # N: 추천 개수. 요청의 recommendCount가 null일 때 쓴다 (interface.md 기본값)
llm_candidate_count: 15  # M: LLM 프롬프트에 넣는 후보 수 (design.md 예시 범위 10~15)
detour_threshold_km: 3.0  # X: 우회 판정 거리 기준 (임시값)
bed_data_max_age_minutes: 15  # 병상 데이터 신선도 임계치 (design.md 예시 범위 10~15분)
require_icu_beds: false  # 중증 환자에게 중환자실 가용병상 조건 적용 여부 (임시값, 의료진 확인 필요)
assessment_timeout_seconds: 3.0  # 환자 상태 판단 LLM 호출 제한 시간 (임시값)
llm_timeout_seconds: 5.0  # 최종 선정 LLM 호출 제한 시간 (design.md 예시값)
vllm_max_waiting_requests: 8  # vLLM 대기 요청 수가 이 값을 넘으면 LLM을 호출하지 않음 (임시값)

# 프롬프트 버전
assessment_prompt_version: patient_assessment_v1  # 환자 상태 판단 (classification/prompts/)
prompt_version: final_selection_v1  # 최종 선정 (selection/prompts/)

# vLLM 서버 주소
vllm_url: http://localhost:8099
vllm_model: Qwen/Qwen3.8-Flash-Next-FP8
