recommend_count: 10  # N: 추천 개수. 요청의 recommendCount가 null일 때 쓴다 (interface.md 기본값)
llm_candidate_count: 15  # M: LLM 프롬프트에 넣는 후보 수 (PRD_v0.1.md F-08 '최종 선정'의 예시 범위 10~15)
detour_threshold_km: 3.0  # X: 우회 판정 거리 기준 (임시값)
bed_data_max_age_minutes: 15  # 병상 데이터 신선도 임계치 (PRD_v0.1.md F-07 '후보 필터와 레벨 진행'의 예시 범위 10~15분)
require_icu_beds: false  # 중증 환자에게 중환자실 가용병상 조건 적용 여부 (임시값, 의료진 확인 필요)
assessment_timeout_seconds: 3.0  # 환자 상태 판단 LLM 호출 제한 시간 (임시값)
llm_timeout_seconds: 5.0  # 최종 선정 LLM 호출 제한 시간 (PRD_v0.1.md F-08 '최종 선정'의 예시값)
vllm_max_waiting_requests: 8  # vLLM 대기 요청 수가 이 값을 넘으면 LLM을 호출하지 않음 (임시값)

# 프롬프트 버전
assessment_prompt_version: patient_assessment_v1  # 환자 상태 판단 (classification/prompts/)
prompt_version: final_selection_v1  # 최종 선정 (selection/prompts/)

# vLLM 서버 주소
vllm_url: http://localhost:8099
vllm_model: Qwen/Qwen3.8-Flash-Next-FP8

# 병원정보 검색 API (docs/10_설계/interface_hospital_api.md). 인증 키는 환경 변수 HOSPITAL_API_CLIENT_ID, HOSPITAL_API_KEY에 둔다
hospital_api_url: http://192.168.1.196:8080/aiemd/api/v1/integration/hospitals  # 개발서버. 운영 서버 주소는 안내받지 않았다
hospital_api_timeout_seconds: 2.0  # 요청 한 번의 제한 시간 (임시값)
hospital_api_max_concurrency: 8  # 병원 상세를 동시에 호출하는 수 (임시값)
hospital_search_radius_km: 50.0  # 환자 위치에서 이 반경 안의 병원만 조회한다. API 최대값은 100 (임시값)

# Tmap ETA API (자동차 경로안내)
tmap_eta_url: https://apis.openapi.sk.com/tmap/routes
tmap_eta_timeout_seconds: 3.0  # 요청 한 번의 제한 시간 (임시값)
tmap_app_key: Ykc0KHKDMH3QGAAb4w3rkaSJadU4PeWq6HlLRlWs  # 개발용 테스트 키(무료, 하루 1,000건). 운영 키는 현장의 이 파일에서 바꾼다
