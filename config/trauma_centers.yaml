# 권역외상센터 목록. 병원정보 검색 API가 권역외상센터 분류를 주지 않아서 개발팀이 관리한다.
# 키는 응급의료기관 기관ID(hpid), 값은 사람이 알아보기 위한 병원명(병원정보 검색 API의 name)이다. 시스템은 hpid만 쓴다.
# 권역외상센터 지정이 바뀌면 이 파일을 고치고 앱을 다시 시작한다.
# 목록이 비어 있으면 시스템은 권역외상센터를 찾지 못하고, 중증외상 환자의 L0 조건에 맞는 병원이 없다.
# API의 응급의료기관 등급(type)은 권역외상센터 지정과 관계없다. 권역외상센터도 지역응급의료센터로 올 수 있다.
