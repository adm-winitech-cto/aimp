services:
  app:
    build: .
    image: agent-app:0.1.0
    restart: unless-stopped
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
    # 호스트 네트워크를 써서 앱이 호스트의 8091 포트에서 바로 받고, 같은 호스트의 vLLM(localhost:8099)에 닿는다.
    network_mode: host
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
