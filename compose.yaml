services:
  app:
    build: .
    image: agent-app:0.1.0
    restart: unless-stopped
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
    ports:
      - "0.0.0.0:8008:8008"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
